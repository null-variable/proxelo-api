syntax = "proto3";

package proxelo.snapshot.v1;

option go_package = "github.com/null-variable/proxelo-api/gen/go/proxelo/snapshot/v1;snapshotv1";

// Snapshot is a fully resolved, immutable configuration for the proxy.
// References between objects are indexes into the arrays of this message.
message Snapshot {
  uint64 revision = 1;
  // SHA-256 of the serialized snapshot with this field cleared.
  bytes hash = 2;
  repeated Listener listeners = 3;
  repeated Site sites = 4;
  repeated Upstream upstreams = 5;
}

message Listener {
  // host:port, for example "0.0.0.0:443".
  string address = 1;
  bool reuse_port = 2;
  uint32 backlog = 3;
  // Index into Snapshot.sites used when no hostname matches.
  optional uint32 default_site = 4;
}

message Site {
  repeated uint32 listeners = 1;
  repeated HostMatch hostnames = 2;
  repeated Route routes = 3;
}

// HostMatch is one nginx server_name. A listener picks the site by exact
// name, then the longest leading wildcard, then the longest trailing
// wildcard, then the first matching regex in snapshot order, then
// Listener.default_site.
message HostMatch {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Lowercase host name.
    KIND_EXACT = 1;
    // "*.example.com" (leading), "mail.*" (trailing) or ".example.com", which
    // matches example.com and every name under it.
    KIND_WILDCARD = 2;
    // PCRE2 pattern matched against the lowercase host, without the "~".
    KIND_REGEX = 3;
  }
  Kind kind = 1;
  string value = 2;
}

message Route {
  PathMatch path = 1;
  Action action = 2;
}

// PathMatch is one nginx location, matched against the normalized path in
// nginx order: an exact match wins; otherwise the longest prefix of either
// prefix kind is found, and wins at once if it is PREFIX_PRIORITY; otherwise
// the first matching regex in route order wins; otherwise the longest prefix.
message PathMatch {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // location = /path
    KIND_EXACT = 1;
    // location /path
    KIND_PREFIX = 2;
    // location ^~ /path
    KIND_PREFIX_PRIORITY = 3;
    // location ~ pattern (PCRE2, case-sensitive)
    KIND_REGEX = 4;
    // location ~* pattern (PCRE2, caseless)
    KIND_REGEX_CI = 5;
  }
  Kind kind = 1;
  string value = 2;
}

message Action {
  oneof kind {
    StaticAction static = 1;
    ProxyAction proxy = 2;
  }
}

message StaticAction {
  string root = 1;
  repeated string index = 2;
}

message ProxyAction {
  // Index into Snapshot.upstreams.
  uint32 upstream = 1;
}

message Upstream {
  enum Balancing {
    BALANCING_UNSPECIFIED = 0;
    BALANCING_ROUND_ROBIN = 1;
  }
  repeated Target targets = 1;
  Balancing balancing = 2;
  uint32 keepalive_idle = 3;
}

message Target {
  // host:port
  string address = 1;
  uint32 weight = 2;
}
