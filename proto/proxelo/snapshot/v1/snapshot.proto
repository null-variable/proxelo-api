syntax = "proto3";

package proxelo.snapshot.v1;

option go_package = "github.com/null-variable/proxelo-api/gen/go/proxelo/snapshot/v1;snapshotv1";

// Snapshot is a fully resolved, immutable configuration for the proxy.
// References between objects are indexes into the arrays of this message.
message Snapshot {
  uint64 revision = 1;
  // SHA-256 of the serialized snapshot with this field cleared.
  bytes hash = 2;
  repeated Listener listeners = 3;
  repeated Site sites = 4;
  repeated Upstream upstreams = 5;
  repeated Certificate certificates = 6;
  repeated AccessLog access_logs = 7;
}

// Certificate is a certificate chain and its private key, referenced by
// index from sites and listeners.
message Certificate {
  // Control plane resource ID.
  string id = 1;
  // PEM: the leaf first, then intermediates.
  string chain_pem = 2;
  // PEM private key.
  string key_pem = 3;
}

// AccessLog is one nginx access_log with its log_format.
message AccessLog {
  // "stdout", "stderr" or an absolute file path, opened for appending.
  string path = 1;
  // Template for one line in nginx log_format syntax, without the newline.
  // Unset values log as "-".
  string format = 2;
  // Escape values for JSON (log_format escape=json) instead of nginx's
  // default \xHH escaping.
  bool escape_json = 3;
}

// HeaderOps changes a header list: remove first, then set, then add.
message HeaderOps {
  // Replace every header with this name.
  repeated HeaderValue set = 1;
  // Append, keeping headers with the same name.
  repeated HeaderValue add = 2;
  // Case-insensitive names to drop.
  repeated string remove = 3;
}

message HeaderValue {
  string name = 1;
  // Template. A header whose value expands to nothing is not sent, as in
  // nginx.
  string value = 2;
  // Response headers only: send with every status. Otherwise only with 200,
  // 201, 204, 206, 301, 302, 303, 304, 307 and 308 (nginx add_header).
  bool always = 3;
}

message Listener {
  // host:port, for example "0.0.0.0:443".
  string address = 1;
  bool reuse_port = 2;
  uint32 backlog = 3;
  // Index into Snapshot.sites used when no hostname matches.
  optional uint32 default_site = 4;
  // Control plane resource ID, for logs, metrics and simulation results.
  string id = 5;
  // TLS on this listener. Unset: plain TCP.
  ListenerTls tls = 6;
  // Offer HTTP/2 through ALPN. Only with tls.
  bool http2 = 7;
}

message ListenerTls {
  enum Version {
    VERSION_UNSPECIFIED = 0;
    VERSION_TLS1_0 = 1;
    VERSION_TLS1_1 = 2;
    VERSION_TLS1_2 = 3;
    VERSION_TLS1_3 = 4;
  }
  // Lowest protocol version accepted. Unspecified: TLS 1.2, as nginx's
  // default ssl_protocols TLSv1.2 TLSv1.3.
  Version min_version = 1;
  // OpenSSL cipher list for TLS 1.2 and below. Empty: "HIGH:!aNULL:!MD5"
  // (nginx default).
  string ciphers = 2;
  // Index into Snapshot.certificates for handshakes without SNI or whose SNI
  // selects a site without certificates. Unset: those handshakes fail.
  optional uint32 default_certificate = 3;
}

message Site {
  repeated uint32 listeners = 1;
  repeated HostMatch hostnames = 2;
  repeated Route routes = 3;
  // Server-level rewrites (nginx rewrite in a server block), run before the
  // route is chosen. They run again after an internal redirect by an index
  // file, try_files or error_page, but not after a route's "rewrite last",
  // as in nginx.
  repeated Rewrite rewrites = 4;
  // error_page for responses produced before a route is chosen.
  repeated ErrorPage error_pages = 5;
  // Server-level return, after the rewrites unless one of them stopped with
  // last or break.
  ReturnAction return = 6;
  // nginx named locations (@name): reachable only from TryFiles and
  // ErrorPage, never by path. Their path, children and rewrites' last flag
  // do not apply.
  repeated Route named_routes = 7;
  // Control plane resource ID.
  string id = 8;
  // Indexes into Snapshot.certificates. On a TLS listener the SNI name
  // selects the site like the Host header does, and these are offered, at
  // most one per key type (RSA, ECDSA).
  repeated uint32 certificates = 9;
  // On plain listeners, answer every request with a 301 to the same URI over
  // https.
  bool redirect_https = 10;
  // Applied to responses made before a route is chosen.
  HeaderOps response_headers = 11;
  // Index into Snapshot.access_logs for requests that end before a route is
  // chosen. Unset: not logged.
  optional uint32 access_log = 12;
}

// Template strings (Rewrite.replacement, ReturnAction.text, TryFiles,
// ErrorPage.uri, HeaderValue.value, AccessLog.format) use nginx variable
// syntax: $name or ${name}, and $1..$9 for
// the captures of the last regex that matched (a regex route or a rewrite).
// The proxy rejects a snapshot that names a variable it does not know.

// Rewrite is one nginx rewrite directive.
message Rewrite {
  enum Flag {
    // No flag: continue with the next rewrite; the route is chosen again
    // afterwards if the path changed.
    FLAG_UNSPECIFIED = 0;
    FLAG_LAST = 1;
    FLAG_BREAK = 2;
    // 302
    FLAG_REDIRECT = 3;
    // 301
    FLAG_PERMANENT = 4;
  }
  // PCRE2 pattern matched against the normalized path.
  string regex = 1;
  // Template. A result starting with http://, https:// or $scheme redirects
  // with 302. A "?" starts new arguments; the old ones are appended unless
  // the replacement ends with "?".
  string replacement = 2;
  Flag flag = 3;
}

// ErrorPage is one nginx error_page directive. It applies to responses the
// proxy produces itself (not to upstream responses), once per request.
message ErrorPage {
  repeated uint32 codes = 1;
  oneof target {
    // Template. A path is an internal redirect (method becomes GET unless
    // HEAD); an absolute http(s) URL is a redirect with status, or 302.
    string uri = 2;
    // Index into Site.named_routes.
    uint32 named = 4;
  }
  // Unset: answer with the original code. 0: answer with the status of the
  // redirected request ("error_page 404 = /x"). Otherwise this code.
  optional uint32 status = 3;
}

// HostMatch is one nginx server_name. A listener picks the site by exact
// name, then the longest leading wildcard, then the longest trailing
// wildcard, then the first matching regex in snapshot order, then
// Listener.default_site.
message HostMatch {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Lowercase host name.
    KIND_EXACT = 1;
    // "*.example.com" (leading), "mail.*" (trailing) or ".example.com", which
    // matches example.com and every name under it.
    KIND_WILDCARD = 2;
    // PCRE2 pattern matched against the lowercase host, without the "~".
    KIND_REGEX = 3;
  }
  Kind kind = 1;
  string value = 2;
}

message Route {
  PathMatch path = 1;
  Action action = 2;
  // Run in order after the route is chosen (nginx rewrite in a location).
  repeated Rewrite rewrites = 3;
  // Nested locations, only under prefix routes. When this route is the
  // longest prefix, its children are searched first with the same order; an
  // exact or regex match among them wins outright, a prefix match replaces
  // this route but still lets this level's regexes run unless this route is
  // PREFIX_PRIORITY (nginx ngx_http_core_find_location).
  repeated Route children = 4;
  // error_page for responses of this route. Like nginx, a route without its
  // own inherits the site's; the control plane resolves that.
  repeated ErrorPage error_pages = 5;
  // Control plane resource ID. A route used in several sites appears in each
  // with the same ID.
  string id = 6;
  // Conditions checked after the path selected this route, all of which must
  // hold. Several routes may share one path match when they have conditions:
  // they are tried in order, then the one without conditions. When none
  // applies, the path match is treated as not matching this request.
  // Request methods, uppercase. Empty: any.
  repeated string methods = 7;
  repeated ValueMatch headers = 8;
  // Query arguments, by name.
  repeated ValueMatch query = 9;
  // CEL expression over `request`, a proxelo.expr.v1.Request, with the
  // standard library and the network extension (cidr, ip). Must evaluate to a
  // bool; an evaluation error counts as false. Empty: none.
  string expr = 10;
  // Applied to every response of this route, including proxied ones. The
  // control plane resolves inheritance.
  HeaderOps response_headers = 11;
  // Applied to the request sent upstream (proxy_set_header).
  HeaderOps request_headers = 12;
  // Index into Snapshot.access_logs. Unset: not logged.
  optional uint32 access_log = 13;
}

// ValueMatch is one condition on a header (case-insensitive name) or a query
// argument (case-sensitive name), compared with the raw value as sent. With
// several values of one name, any matching value satisfies it.
message ValueMatch {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_PRESENT = 1;
    OP_ABSENT = 2;
    OP_EQUALS = 3;
    OP_PREFIX = 4;
    OP_SUFFIX = 5;
    OP_CONTAINS = 6;
    // PCRE2 pattern, case-sensitive.
    OP_REGEX = 7;
  }
  string name = 1;
  Op op = 2;
  // Unused by PRESENT and ABSENT.
  string value = 3;
}

// PathMatch is one nginx location, matched against the normalized path in
// nginx order: an exact match wins; otherwise the longest prefix of either
// prefix kind is found, and wins at once if it is PREFIX_PRIORITY; otherwise
// the first matching regex in route order wins; otherwise the longest prefix.
message PathMatch {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // location = /path
    KIND_EXACT = 1;
    // location /path
    KIND_PREFIX = 2;
    // location ^~ /path
    KIND_PREFIX_PRIORITY = 3;
    // location ~ pattern (PCRE2, case-sensitive)
    KIND_REGEX = 4;
    // location ~* pattern (PCRE2, caseless)
    KIND_REGEX_CI = 5;
  }
  Kind kind = 1;
  string value = 2;
}

message Action {
  oneof kind {
    StaticAction static = 1;
    ProxyAction proxy = 2;
    ReturnAction return = 3;
  }
}

// ReturnAction is nginx return. For 301, 302, 303, 307 and 308 text is the
// Location; a path is made absolute with the request host and port. For other
// codes it is the body. A code of 400 or more without text answers like an
// error, so ErrorPage applies. 444 closes the connection without a response.
message ReturnAction {
  uint32 status = 1;
  // Template.
  string text = 2;
}

// TryFiles is nginx try_files: the first file that exists under the static
// root is served; a name ending in "/" matches a directory. Otherwise the
// fallback applies.
message TryFiles {
  // Templates, for example "$uri" and "$uri/".
  repeated string files = 1;
  oneof fallback {
    // Internal redirect, for example "/index.html" or "/index.php?$args".
    string uri = 2;
    // "=404"
    uint32 status = 3;
    // "@name": index into Site.named_routes.
    uint32 named = 4;
  }
}

message StaticAction {
  string root = 1;
  repeated string index = 2;
  TryFiles try_files = 3;
}

message ProxyAction {
  // Index into Snapshot.upstreams.
  uint32 upstream = 1;
  // Zero: 60 s, the nginx defaults of proxy_connect_timeout,
  // proxy_send_timeout and proxy_read_timeout.
  uint32 connect_timeout_ms = 2;
  uint32 send_timeout_ms = 3;
  uint32 read_timeout_ms = 4;
  // proxy_next_upstream. Empty: error and timeout.
  repeated NextUpstream next_upstream = 5;
  // proxy_next_upstream_tries. Zero: no limit.
  uint32 next_upstream_tries = 6;
}

// When a request moves on to the next target (proxy_next_upstream).
enum NextUpstream {
  NEXT_UPSTREAM_UNSPECIFIED = 0;
  // Never; overrides the others.
  NEXT_UPSTREAM_OFF = 1;
  NEXT_UPSTREAM_ERROR = 2;
  NEXT_UPSTREAM_TIMEOUT = 3;
  NEXT_UPSTREAM_HTTP_500 = 4;
  NEXT_UPSTREAM_HTTP_502 = 5;
  NEXT_UPSTREAM_HTTP_503 = 6;
  NEXT_UPSTREAM_HTTP_504 = 7;
  NEXT_UPSTREAM_HTTP_403 = 8;
  NEXT_UPSTREAM_HTTP_404 = 9;
  NEXT_UPSTREAM_HTTP_429 = 10;
  // Also retry POST, PATCH and other non-idempotent requests.
  NEXT_UPSTREAM_NON_IDEMPOTENT = 11;
}

message Upstream {
  enum Balancing {
    BALANCING_UNSPECIFIED = 0;
    // Smooth weighted round robin (nginx default).
    BALANCING_ROUND_ROBIN = 1;
    // Fewest active requests relative to weight, ties by round robin (nginx
    // least_conn).
    BALANCING_LEAST_CONN = 2;
    // Client address: the first three octets of IPv4, all of IPv6 (nginx
    // ip_hash).
    BALANCING_IP_HASH = 3;
    // hash_key, remapped like Cache::Memcached when a target is unavailable
    // (nginx hash).
    BALANCING_HASH = 4;
    // hash_key on a ketama ring of 160 points per weight unit (nginx hash
    // consistent).
    BALANCING_HASH_CONSISTENT = 5;
    // Weighted random (nginx random).
    BALANCING_RANDOM = 6;
    // The less loaded of two weighted random picks (nginx random two
    // least_conn).
    BALANCING_RANDOM_TWO = 7;
  }
  repeated Target targets = 1;
  Balancing balancing = 2;
  uint32 keepalive_idle = 3;
  // Control plane resource ID.
  string id = 4;
  // Passive health (nginx max_fails and fail_timeout): after max_fails
  // failures within fail_timeout a target is skipped for fail_timeout.
  // max_fails 0 disables it. With a single target it does not apply, as in
  // nginx. The control plane sends nginx's defaults, 1 and 10 s.
  uint32 max_fails = 5;
  uint32 fail_timeout_ms = 6;
  // How long an idle upstream connection is kept. Zero: 60 s.
  uint32 keepalive_timeout_ms = 7;
  // Requests per upstream connection before it is closed. Zero: 1000.
  uint32 keepalive_requests = 8;
  // Host header sent upstream unless a header operation sets one: nginx
  // $proxy_host, the upstream's name. Empty: the target's host:port.
  string host = 9;
  // Key for BALANCING_HASH and BALANCING_HASH_CONSISTENT, a template.
  string hash_key = 10;
  // Active health checks. Unset: none.
  HealthCheck health_check = 11;
  // Session affinity. Unset: none.
  Sticky sticky = 12;
  // Requests waiting for a target when every target is at max_conns
  // (nginx queue). Zero: none, the request fails with 502.
  uint32 queue_size = 13;
  // How long a queued request waits. Zero: 60 s.
  uint32 queue_timeout_ms = 14;
  // Close an upstream connection after it has been open this long (nginx
  // keepalive_time). Zero: 1 h.
  uint32 keepalive_time_ms = 15;
}

// Active health checks run by every node against every target. A target
// fails the check after `fails` failed probes in a row and passes it again
// after `passes` good ones; while failing it takes no requests.
message HealthCheck {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // HTTP/1.1 request; passes on an expected status and body.
    KIND_HTTP = 1;
    // TCP connect.
    KIND_TCP = 2;
  }
  Kind kind = 1;
  // Zero: 5 s.
  uint32 interval_ms = 2;
  // Per probe. Zero: 1 s.
  uint32 timeout_ms = 3;
  // Zero: 1.
  uint32 fails = 4;
  // Zero: 1.
  uint32 passes = 5;
  // HTTP: request path and query. Empty: "/".
  string path = 6;
  // HTTP: Host header. Empty: the upstream's host.
  string host = 7;
  // HTTP: passing statuses as ranges, e.g. 200-399. Empty: 200-399.
  repeated StatusRange statuses = 8;
  // HTTP: PCRE2 pattern the body must match. Empty: any body.
  string body = 9;
  // Probe this port instead of the target's.
  uint32 port = 10;
}

message StatusRange {
  uint32 from = 1;
  uint32 to = 2;
}

// Session affinity (nginx sticky).
message Sticky {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The proxy sets a cookie naming the target (nginx sticky cookie).
    KIND_COOKIE = 1;
    // The target is named by a template, e.g. a cookie the application
    // sets (nginx sticky route); its value is matched against Target.route.
    KIND_ROUTE = 2;
  }
  Kind kind = 1;
  // KIND_COOKIE: cookie name.
  string cookie = 2;
  // KIND_COOKIE: Max-Age in seconds. Zero: a session cookie.
  uint32 max_age_s = 3;
  // KIND_COOKIE: Path attribute. Empty: "/".
  string path = 4;
  // KIND_COOKIE: Domain attribute. Empty: none.
  string domain = 5;
  bool http_only = 6;
  bool secure = 7;
  // KIND_COOKIE: SameSite attribute: "strict", "lax", "none" or empty.
  string same_site = 8;
  // KIND_ROUTE: templates tried in order; the first non-empty value wins.
  repeated string route = 9;
}

message Target {
  // host:port
  string address = 1;
  uint32 weight = 2;
  // Used only when every other target is unavailable (nginx backup).
  bool backup = 3;
  // Takes no requests (nginx down).
  bool down = 4;
  // Requests in progress at most. Zero: no limit (nginx max_conns).
  uint32 max_conns = 5;
  // After the target recovers, its weight grows from 1 to the configured
  // weight over this time (nginx slow_start). Zero: at once.
  uint32 slow_start_ms = 6;
  // Re-resolve the host name every resolve_interval_ms while running and
  // serve the addresses it has now (nginx resolve with resolver valid=).
  bool resolve = 7;
  // Zero: 30 s.
  uint32 resolve_interval_ms = 8;
  // Sticky route value naming this target (nginx server route=).
  string route = 9;
}
