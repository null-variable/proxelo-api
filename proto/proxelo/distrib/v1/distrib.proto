syntax = "proto3";

package proxelo.distrib.v1;

import "proxelo/snapshot/v1/snapshot.proto";

option go_package = "github.com/null-variable/proxelo-api/gen/go/proxelo/distrib/v1;distribv1";

// DistributionService is served by the control plane. Proxies dial in and keep the
// stream open; the control plane pushes snapshots, the proxy reports back.
service DistributionService {
  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

// Sent by the proxy.
message SyncRequest {
  oneof kind {
    Hello hello = 1;
    Ack ack = 2;
    Stats stats = 3;
  }
}

// Sent by the control plane.
message SyncResponse {
  oneof kind {
    // Replaced by snapshot_data, which the proxy can verify; rejected.
    proxelo.snapshot.v1.Snapshot snapshot = 1 [deprecated = true];
    // A serialized proxelo.snapshot.v1.Snapshot. The proxy checks its hash
    // against the bytes and keeps them as the last-known-good snapshot.
    bytes snapshot_data = 3;
    Challenges challenges = 2;
  }
}

// Challenges replaces every ACME challenge the proxy answers. Challenges are
// not part of a snapshot and are not persisted.
message Challenges {
  repeated HttpChallenge http01 = 1;
  repeated TlsAlpnChallenge tls_alpn01 = 2;
}

// HttpChallenge is answered on plain listeners at
// /.well-known/acme-challenge/<token>, before any site.
message HttpChallenge {
  string token = 1;
  string key_authorization = 2;
}

// TlsAlpnChallenge is offered on TLS listeners to handshakes for name that
// ask for the acme-tls/1 protocol.
message TlsAlpnChallenge {
  // Lowercase DNS name.
  string name = 1;
  string chain_pem = 2;
  string key_pem = 3;
}

message Hello {
  string node_id = 1;
  string proxy_version = 2;
  // Revision of the last-known-good snapshot the proxy is serving, 0 if none.
  uint64 active_revision = 3;
}

// Stats are counters cumulative since the proxy started, sent every few
// seconds. The control plane's commit-confirm guard watches their rates
// while a revision awaits confirmation.
message Stats {
  // Revision served when the counters were read.
  uint64 revision = 1;
  // Finished client requests.
  uint64 requests = 2;
  // Of requests, those answered with a 5xx status.
  uint64 server_errors = 3;
  // Connection and exchange attempts to upstream targets.
  uint64 upstream_attempts = 4;
  // Of upstream_attempts, those that failed to connect or to get a response.
  uint64 upstream_failures = 5;
  // The same counters per resource, cumulative since start and keyed by
  // resource ID, for traffic shown on the configuration topology. Resources
  // of earlier snapshots stay listed.
  repeated SiteStats sites = 6;
  repeated RouteStats routes = 7;
  repeated TargetStats targets = 8;
}

message SiteStats {
  string id = 1;
  uint64 requests = 2;
  uint64 server_errors = 3;
}

// RouteStats counts the requests a route answered within one site.
message RouteStats {
  string site_id = 1;
  string id = 2;
  uint64 requests = 3;
  uint64 server_errors = 4;
}

// TargetStats counts attempts to one upstream target.
message TargetStats {
  string upstream_id = 1;
  // host:port as configured.
  string address = 2;
  uint64 attempts = 3;
  uint64 failures = 4;
}

message Ack {
  uint64 revision = 1;
  bool applied = 2;
  // Set when applied is false.
  string error = 3;
}
