syntax = "proto3";

package proxelo.distrib.v1;

import "proxelo/snapshot/v1/snapshot.proto";

option go_package = "github.com/null-variable/proxelo-api/gen/go/proxelo/distrib/v1;distribv1";

// DistributionService is served by the control plane. Proxies dial in and keep the
// stream open; the control plane pushes snapshots, the proxy reports back.
service DistributionService {
  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

// Sent by the proxy.
message SyncRequest {
  oneof kind {
    Hello hello = 1;
    Ack ack = 2;
    Stats stats = 3;
    TapEvents tap_events = 4;
  }
}

// Sent by the control plane.
message SyncResponse {
  oneof kind {
    // Replaced by snapshot_data, which the proxy can verify; rejected.
    proxelo.snapshot.v1.Snapshot snapshot = 1 [deprecated = true];
    // A serialized proxelo.snapshot.v1.Snapshot. The proxy checks its hash
    // against the bytes and keeps them as the last-known-good snapshot.
    bytes snapshot_data = 3;
    Challenges challenges = 2;
    TapFilter tap = 4;
  }
}

// TapFilter selects requests the proxy reports as they finish, for Live
// Tap. A new filter replaces the previous one; an empty one (no id) stops
// tapping. Filtering and sampling happen on the proxy so only matching
// requests reach the control plane. The filter is not persisted: a proxy
// that reconnects taps nothing until it is sent again.
message TapFilter {
  // Identifies the tap; events carry it back.
  string id = 1;
  // Requests answered by one of these sites, or any when empty.
  repeated string site_ids = 2;
  // Requests answered by one of these routes, or any when empty.
  repeated string route_ids = 3;
  // Client address prefixes, CIDR; any when empty.
  repeated string cidrs = 4;
  // Report one in sample matching requests; 0 and 1 report all.
  uint32 sample = 5;
  // Events per second the proxy sends at most; 0 means 100. Matching
  // requests beyond it are counted in TapEvents.dropped.
  uint32 max_per_second = 6;
  // Request header names (lowercase) whose values are reported. Other
  // headers are left out.
  repeated string headers = 7;
}

// TapEvents is a batch of tapped requests, sent a few times a second.
message TapEvents {
  string tap_id = 1;
  repeated TapEvent events = 2;
  // Matching requests left out since the last batch by max_per_second.
  uint64 dropped = 3;
}

message TapEvent {
  // Unix time the request finished, in microseconds.
  int64 time_us = 1;
  string site_id = 2;
  // Empty when no route matched.
  string route_id = 3;
  string client = 4;
  string method = 5;
  string host = 6;
  // The request target as received.
  string uri = 7;
  uint32 status = 8;
  // Microseconds from the request head to the end of the response.
  uint64 duration_us = 9;
  // host:port of the last upstream target tried, if any.
  string upstream = 10;
  uint32 upstream_status = 11;
  uint64 bytes_sent = 12;
  // Values of the requested headers that the request had.
  repeated TapHeader headers = 13;
  // "1.1" or "2".
  string protocol = 14;
}

message TapHeader {
  string name = 1;
  string value = 2;
}

// Challenges replaces every ACME challenge the proxy answers. Challenges are
// not part of a snapshot and are not persisted.
message Challenges {
  repeated HttpChallenge http01 = 1;
  repeated TlsAlpnChallenge tls_alpn01 = 2;
}

// HttpChallenge is answered on plain listeners at
// /.well-known/acme-challenge/<token>, before any site.
message HttpChallenge {
  string token = 1;
  string key_authorization = 2;
}

// TlsAlpnChallenge is offered on TLS listeners to handshakes for name that
// ask for the acme-tls/1 protocol.
message TlsAlpnChallenge {
  // Lowercase DNS name.
  string name = 1;
  string chain_pem = 2;
  string key_pem = 3;
}

message Hello {
  string node_id = 1;
  string proxy_version = 2;
  // Revision of the last-known-good snapshot the proxy is serving, 0 if none.
  uint64 active_revision = 3;
}

// Stats are counters cumulative since the proxy started, sent every few
// seconds. The control plane's commit-confirm guard watches their rates
// while a revision awaits confirmation.
message Stats {
  // Revision served when the counters were read.
  uint64 revision = 1;
  // Finished client requests.
  uint64 requests = 2;
  // Of requests, those answered with a 5xx status.
  uint64 server_errors = 3;
  // Connection and exchange attempts to upstream targets.
  uint64 upstream_attempts = 4;
  // Of upstream_attempts, those that failed to connect or to get a response.
  uint64 upstream_failures = 5;
  // The same counters per resource, cumulative since start and keyed by
  // resource ID, for traffic shown on the configuration topology. Resources
  // of earlier snapshots stay listed.
  repeated SiteStats sites = 6;
  repeated RouteStats routes = 7;
  repeated TargetStats targets = 8;
}

message SiteStats {
  string id = 1;
  uint64 requests = 2;
  uint64 server_errors = 3;
}

// RouteStats counts the requests a route answered within one site.
message RouteStats {
  string site_id = 1;
  string id = 2;
  uint64 requests = 3;
  uint64 server_errors = 4;
}

// TargetStats counts attempts to one upstream target.
message TargetStats {
  string upstream_id = 1;
  // host:port as configured.
  string address = 2;
  uint64 attempts = 3;
  uint64 failures = 4;
  // Whether the target takes requests: not down by passive or active
  // health checks.
  bool healthy = 5;
  // Last active health check failure, if failing.
  string check_error = 6;
}

message Ack {
  uint64 revision = 1;
  bool applied = 2;
  // Set when applied is false.
  string error = 3;
}
